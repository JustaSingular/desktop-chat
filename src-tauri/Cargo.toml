[package]
name = "desktop-chat"
version = "0.1.0"
description = "A screen-edge pull-out chat tab"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "desktop_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"     # the whole point is a small, light app
panic = "abort"
strip = true
